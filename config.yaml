paths:
  processed_matrix: data/processed/user_item_matrix.parquet
  model_file: artifacts/item_similarity.joblib
  metrics_file: artifacts/metrics.json

download:
  url: https://files.grouplens.org/datasets/movielens/ml-latest-small.zip
  dir: data/raw
  ratings_file: ratings.csv
  movies_file: movies.csv

preprocess:
  min_rating: 0.5
  min_ratings_per_movie: 10
  min_ratings_per_user: 5

model:
  min_common_users: 3
  top_k: 5

evaluation:
  test_fraction: 0.2
  k: 5
  like_threshold: 4.0